<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Safarnama Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Dark theme only, by choice. Layout: a sticky scoreboard strip on top. Board = one column per category on wide screens, category cards on narrow ones. Question = one centred card with a countdown. */
:root{
  color-scheme:dark;
  --bg:#0C1224; --surface:#151D38; --ink:#EDF0FA; --muted:#9AA6C6; --line:#27315A;
  --tile:#202C58; --tile-fg:#FFC85A;
  --accent:#F5A623; --on-accent:#1B1405;
  --good:#27B57A; --on-good:#06180F; --warn:#FF6B5E; --on-warn:#2A0604; --focus:#8AA4FF;
  --t1:#FF7A54; --t2:#5AA2FF; --t3:#2FC58A; --t4:#A98BFF; --t5:#F0B429; --t6:#FF6FAE; --t7:#2CC4D6; --t8:#93A3B8;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.45;
  padding-block:0 16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg)}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
h1,h2,h3{font-family:var(--display); margin:0; text-wrap:balance}
.app{max-width:1400px; margin-inline:auto; min-height:100%; display:flex; flex-direction:column}
.eyebrow{font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}

/* top bar */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding-block:12px 10px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:10px}
.top-row{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px 12px}
.top-row .logo{justify-self:start}
.top-row .top-right{justify-self:end}
@media (max-width:719px){.top-row{grid-template-columns:auto 1fr}.top-row .brand{grid-column:1 / -1; order:3; justify-self:center}}
.brand{font-family:'Black Bones',var(--display); font-weight:800; font-size:clamp(24px,2vw + 14px,34px); line-height:1; letter-spacing:.01em; display:flex; align-items:center; justify-content:center; gap:10px; text-align:center}
.brand i{width:12px; height:12px; border-radius:3px; background:var(--accent); transform:rotate(45deg)}
.top-right{display:flex; flex-direction:column; align-items:flex-end; gap:6px}
.top-actions{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end}
/* the logo is white on black, so screen blending lets the dark page show through */
.logo{display:block; height:34px; width:auto; mix-blend-mode:screen}
.scores{display:flex; gap:8px; overflow-x:auto; padding-block:2px 4px; scrollbar-width:thin}
.chip{flex:none; display:flex; align-items:center; gap:8px; padding:6px 12px; border:1.5px solid var(--line); border-radius:999px; background:var(--surface); font-size:14px; font-weight:500}
.chip .dot{width:10px; height:10px; border-radius:50%; background:var(--tc)}
.chip b{font-family:var(--mono); font-weight:500; font-variant-numeric:tabular-nums}
.chip.on{border-color:var(--tc); background:color-mix(in srgb,var(--tc) 16%,var(--surface)); font-weight:700}

/* buttons */
.btn{min-height:46px; padding:10px 20px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); font-weight:700; font-size:15px}
.btn.sm{min-height:36px; padding:6px 14px; font-size:13px}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn.good{background:var(--good); border-color:var(--good); color:var(--on-good)}
.btn.bad{background:var(--warn); border-color:var(--warn); color:var(--on-warn)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn[aria-pressed="false"]{color:var(--muted)}

section.screen{padding-top:24px}

/* setup */
.setup{width:100%; max-width:760px; margin-inline:auto; padding-top:16px}
.setup h1{font-size:clamp(2.2rem,1.4rem + 4vw,3.6rem); font-weight:800; line-height:1.02; margin-block:8px 12px; letter-spacing:-.02em}
.setup h1::after{content:""; display:block; width:72px; height:6px; border-radius:3px; background:var(--accent); margin-top:14px}
.lede{color:var(--muted); max-width:52ch; margin:0 0 28px}
.count-row{display:flex; align-items:center; gap:16px; margin-bottom:20px; flex-wrap:wrap}
.count-row label{font-weight:700}
.stepper{display:flex; align-items:center; gap:4px; background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:4px}
.stepper button{width:44px; height:44px; border-radius:9px; border:0; background:transparent; font-size:22px; font-weight:700}
.stepper button:hover:not(:disabled){background:var(--bg)}
.stepper button:disabled{opacity:.35; cursor:not-allowed}
.stepper output{min-width:36px; text-align:center; font-family:var(--mono); font-size:20px}
.names{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-bottom:24px}
.field{display:flex; flex-direction:column; gap:6px; min-width:0}
.field span{font-size:13px; font-weight:700; color:var(--muted); display:flex; align-items:center; gap:8px}
.field span i{width:10px; height:10px; border-radius:50%; background:var(--tc)}
.field input{width:100%; font:inherit; font-size:16px; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink)}
.field input::placeholder{color:var(--muted); opacity:.7}

/* board */
#screen-board{flex:1; min-height:0; display:flex; flex-direction:column; padding-top:12px}
.board-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:10px}
.board-head h2{font-size:clamp(1.3rem,1rem + 1.5vw,1.9rem); font-weight:800; display:flex; align-items:center; gap:10px}
.board-head h2 i{width:14px; height:14px; border-radius:50%; flex:none}
/* The screen is split into blocks, 3 across by 2 down (2 across by 3 down on a phone). Each block holds one category and its ten questions. The blocks share the free height, so the whole board fits the screen. */
.board{flex:1; min-height:calc(var(--rowsm,3) * 190px); display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); grid-template-rows:repeat(var(--rowsm,3),minmax(0,1fr)); gap:8px}
.cat{container-type:inline-size; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:8px; min-width:0; min-height:0; display:grid; grid-template-rows:auto minmax(0,1fr); gap:6px}
.cat-head{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:2px 10px; min-width:0}
.cat h3{font-size:clamp(17px,6cqw,28px); font-weight:800; letter-spacing:-.005em; line-height:1.15}
.cat small{font-size:12px; font-weight:700; color:var(--muted); white-space:nowrap}
.tiles{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); grid-template-rows:repeat(5,minmax(0,1fr)); gap:5px; min-height:0}
.tile{position:relative; border:0; border-radius:8px; padding:0; min-height:26px; background:var(--tile); color:var(--tile-fg); font-family:var(--mono); font-size:clamp(13px,5.2cqw,24px); font-weight:500; font-variant-numeric:tabular-nums}
.tile:hover:not(:disabled){filter:brightness(1.18)}
.tile.used{background:transparent; color:var(--muted); box-shadow:inset 0 0 0 1px var(--line); opacity:.55; cursor:default; text-decoration:line-through}
.tile.won::after{content:""; position:absolute; top:5px; right:5px; width:7px; height:7px; border-radius:50%; background:var(--tc)}
@media (min-width:720px){
  .board{grid-template-columns:repeat(3,minmax(0,1fr)); grid-template-rows:repeat(var(--rows,2),minmax(0,1fr)); min-height:calc(var(--rows,2) * 200px); gap:12px}
  .cat{padding:14px; gap:10px}
  .tiles{grid-template-columns:repeat(5,minmax(0,1fr)); grid-template-rows:repeat(2,minmax(0,1fr)); gap:8px}
  .tile{min-height:40px; border-radius:10px}
}
@media (prefers-reduced-motion:no-preference){.tile{transition:filter .12s}}

/* question */
.qcard{width:100%; max-width:860px; margin-inline:auto; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:clamp(18px,4vw,36px); display:flex; flex-direction:column; gap:18px}
.q-top{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap}
.q-cat{display:flex; flex-direction:column; gap:8px; min-width:0}
.q-cat h2{font-size:clamp(1.3rem,1rem + 1.5vw,1.8rem); font-weight:800}
.pts{align-self:flex-start; background:var(--tile); color:var(--tile-fg); font-family:var(--mono); font-size:15px; padding:4px 12px; border-radius:8px}
.timer{text-align:right}
.timer .t{font-family:var(--mono); font-size:clamp(2rem,1.4rem + 3vw,3rem); line-height:1; font-variant-numeric:tabular-nums}
.timer .s{display:block; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-top:4px; min-height:1.2em}
.timer.low .t{color:var(--warn)}
.bar{height:8px; border-radius:4px; background:var(--bg); overflow:hidden}
.bar i{display:block; height:100%; width:100%; background:var(--accent)}
.timer.low ~ .bar i, .barlow i{background:var(--warn)}
.who{display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px}
.who i{width:14px; height:14px; border-radius:50%; flex:none}
.who span{font-weight:500; color:var(--muted)}
.note{margin:0; padding:10px 14px; border-radius:10px; background:color-mix(in srgb,var(--accent) 22%,var(--surface)); font-weight:500}
.qtext{margin:0; font-family:var(--display); font-weight:600; font-size:clamp(1.5rem,1rem + 2.2vw,2.4rem); line-height:1.22; text-wrap:balance; overflow-wrap:anywhere; padding-block:8px}
.qtext.mono{font-family:var(--mono); font-weight:500; letter-spacing:.14em; text-transform:uppercase}
.answer{border-left:5px solid var(--good); padding:12px 16px; background:color-mix(in srgb,var(--good) 12%,var(--surface)); border-radius:0 10px 10px 0}
.answer p{margin:4px 0 0; font-size:clamp(1.15rem,1rem + .8vw,1.5rem); font-weight:700; overflow-wrap:anywhere}
.actions{display:flex; gap:10px; flex-wrap:wrap}
.actions .btn{flex:1 1 130px}

/* edit scores panel */
.overlay{position:fixed; inset:0; z-index:20; background:rgba(8,12,28,.7); display:flex; align-items:center; justify-content:center; padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px)); padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.dialog{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:clamp(16px,4vw,26px); width:100%; max-width:480px; max-height:100%; overflow-y:auto; display:flex; flex-direction:column; gap:14px}
.dialog h3{font-size:clamp(1.3rem,1.1rem + 1vw,1.7rem); font-weight:800}
.emsg{margin:0; color:var(--muted); font-size:14px}
.elist{display:flex; flex-direction:column; gap:8px}
.erow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 10px; align-items:center}
.erow .en{display:flex; align-items:center; gap:8px; font-weight:700; min-width:0; overflow-wrap:anywhere}
.erow .en i{width:12px; height:12px; border-radius:50%; flex:none}
.erow .ec{display:flex; align-items:center; gap:6px}
.erow .ec button{width:40px; height:40px; border-radius:8px; border:1.5px solid var(--line); background:var(--bg); font-size:20px; font-weight:700}
.erow .ec input{width:92px; height:40px; text-align:center; font-family:var(--mono); font-size:16px; border-radius:8px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink)}

/* final */
.final{width:100%; max-width:760px; margin-inline:auto}
.final h2{font-size:clamp(1.8rem,1.2rem + 3vw,3rem); font-weight:800; line-height:1.05; margin-block:8px 24px; letter-spacing:-.02em}
.rank{list-style:none; margin:0 0 28px; padding:0; display:flex; flex-direction:column; gap:10px}
.rank li{display:grid; grid-template-columns:34px 1fr auto; gap:6px 12px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px}
.rank li.first{border-color:var(--accent); border-width:2px}
.rank .n{font-family:var(--mono); font-size:18px; color:var(--muted)}
.rank .nm{display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; min-width:0; overflow-wrap:anywhere}
.rank .nm i{width:12px; height:12px; border-radius:50%; flex:none}
.rank .sc{font-family:var(--mono); font-size:24px; font-variant-numeric:tabular-nums}
.rank .meta{grid-column:2 / 4; display:flex; align-items:center; gap:12px; font-size:13px; color:var(--muted)}
.rank .meta .bar{flex:1}
.rank .meta .bar i{background:var(--tc)}
</style>

      <p class="note" id="qNote" role="status" hidden></p>
      <p class="qtext" id="qText"></p>
      <div class="answer" id="answerBox" hidden>
        <span class="eyebrow">Answer</span>
        <p id="aText"></p>
      </div>
      <div class="actions" id="liveActions">
        <button class="btn primary" id="revealBtn" type="button">Reveal</button>
        <button class="btn good" id="rightBtn" type="button">Correct</button>
        <button class="btn bad" id="wrongBtn" type="button">Wrong</button>
        <button class="btn" id="passBtn" type="button">Pass</button>
      </div>
      <div class="actions" id="endedActions" hidden>
        <button class="btn primary" id="backBtn" type="button">Back to board</button>
      </div>
    </div>
  </section>

  <!-- Screen 4: final scores -->
  <section class="screen" id="screen-final" hidden>
    <div class="final">
      <p class="eyebrow">Final scores</p>
      <h2 id="winnerLine"></h2>
      <ol class="rank" id="rankList"></ol>
      <div class="actions">
        <button class="btn primary" id="againBtn" type="button">Play again, same teams</button>
        <button class="btn" id="newBtn" type="button">New teams</button>
      </div>
    </div>
  </section>

</div>

<div class="overlay" id="editBox" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="eTitle">
    <h3 id="eTitle">Edit scores</h3>
    <p class="emsg">Type a score, or use the buttons to change it by 100.</p>
    <div class="elist" id="editList"></div>
    <button class="btn primary" id="editDone" type="button">Done</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* Questions from the sheet "Quiz for Safarnama #6". Each row is [question, answer], 100 to 1000 points. */
var CATS=[
{n:"Around the world",q:[
["Which is the largest continent in the world by area?","Asia"],
["Which is the largest cold desert in the world?","The Antarctic Desert"],
["Which is the highest mountain peak located entirely within India?","Kangchenjunga"],
["Which Indian state has the longest coastline?","Gujarat"],
["Which bridge connects Rameshwaram to Mandapam?","Pamban bridge"],
["Where is India's only confirmed active volcano located?","Barren Island (Andaman)"],
["Which river is called the \"Sorrow of Bihar\" because of its frequent, devastating floods?","Kosi"],
["Which country has the most number of islands in the world?","Sweden. Over 200000 islands."],
["Ulaanbaatar is the capital of which country?","Mongolia"],
["What unique phenomenon is the Loktak lake in Manipur famous for?","Floating 'phumdis'"]
]},
{n:"E = MC Hammered",q:[
["Which planet is known as the \"Red Planet\"?","Mars"],
["Oxygen makes up what percentage of the Earth's atmosphere?","21%"],
["What is the hardest natural substance on Earth?","Diamond"],
["What is the name of the galaxy closest to Milky way?","Andromeda"],
["Which part of the human brain is mainly responsible for balance and coordination?","Cerebellum"],
["What is the name of the first artificial satellite launched into space in 1957?","Sputnik 1"],
["How long does it take for the Sun's rays to reach the earth?","8 minutes"],
["What was the name of the lander and rover that was sent to the moon with Chandrayaan in 2023?","The lander was named Vikram, and the rover was named Pragyan."],
["Which metal has the highest melting point of all metals, at over 3,400°C?","Tungsten"],
["Which particle, discovered at CERN in 2012, is popularly called the \"God particle\"?","Higgs boson"]
]},
{n:"Almost there",q:[
["Which is the second-largest planet in our solar system?","Saturn"],
["Which is the second most abundant gas in Earth's atmosphere?","Oxygen"],
["Which team was the runner-up in the 2019 Cricket World Cup final?","New Zealand"],
["Who was the second President of India?","Sarvepalli Radhakrishnan"],
["Which is the second most-spoken native language in the world?","Spanish"],
["Which is the second-largest lake in the world by surface area?","Lake Superior"],
["Who was the second person to walk on the Moon?","Buzz Aldrin"],
["Which Indian won the Silver medal in the 2024 Paris Olympics?","Neeraj Chopra"],
["Which is the second-longest bone in the human body?","Tibia (shinbone)"],
["Which is the second fastest land animal?","Pronghorn"]
]},
{n:"Catch me if you 'CAN'",q:[
["Kids eat me on Halloween. Who am I?","Candy"],
["Which country would you go for Maple syrup and ice hockey?","Canada"],
["A popular film starring Mena Suvari - _____ Beauty","American"],
["I have multiple names, eg. Mount Vesuvius, Krakatoa, and Mauna Loa. Who am I?","Volcano"],
["A spot currently not occupied","Vacant"],
["I scoop fish for lunch and keep them in my pouch. Who am I?","Pelican"],
["Strange or mysterious in an unsettling way.","Uncanny"],
["A severe tropical storm with violent winds and heavy rain.","Hurricane"],
["Emitting light as a result of being heated; also passionate or brilliant.","Incandescent"],
["A pirate, originally one operating in the Caribbean.","Buccaneer"]
]},
{n:"Picture abhi baki hai",q:[
["Which film features the line \"Bade bade deshon mein aisi chhoti chhoti baatein hoti rehti hain\"?","Dilwale Dulhania Le Jayenge"],
["Which actress made her Bollywood debut opposite Shah Rukh Khan in Om Shanti Om (2007)","Deepika Padukone"],
["Who wrote the lyrics of the famous train song \"Chaiyya Chaiyya\"?","Gulzar"],
["3 Idiots is loosely based on which novel?","Five Point Someone"],
["Who sang the song Sawar Loon from Lootera?","Monali Thakur"],
["Which film is widely credited as the first Bollywood film to cross the ₹100 crore mark at the box office?","Ghajini"],
["For which film did A.R. Rahman win two Oscars?","Slumdog Millionare"],
["Which Bollywood film was the first Indian film nominated for the Academy Award for Best Foreign Language Film?","Mother India"],
["Who was the music director of Gangs of Wasseypur (2012)?","Sneha Khanwalkar"],
["Who were the two female singers of \"Patakha Guddi\" (from the 2014 film Highway)?","Jyoti and Sultana Nooran"]
]},
{n:"Where are the vowels?",mono:true,q:[
["SHLY","Sholay"],
["DNGL","Dangal"],
["PNSNGHTMR","Pan Singh Tomar"],
["MKKBZ","Mukkabaaz"],
["KHSLKGHSL","Khosla ka Ghosla"],
["CHKDND","Chak De India"],
["NDHDHN","Andhadhun"],
["PPLLV","Peepli Live"],
["TRBNLDN","Tere Bin Laden"],
["KHSNTH","Ek Hasina Thi"]
]}
];
var POINTS=[100,200,300,400,500,600,700,800,900,1000];
var TOTAL=CATS.length*POINTS.length;
/* 100-500 points: 45 seconds. 600-1000 points: 90 seconds. A question handed to the next team (time's up or pass): 20 seconds for 100-500, 30 seconds for 600-1000. */
function limitFor(r){return (r<=4?45:90)*1000;}
function passMsFor(r){return (r<=4?20:30)*1000;}
var KEY='safarnama-quiz-v3';

function $(id){return document.getElementById(id);}
/* Capitalise the first letter of every word in a team name. */
function nameCase(s){return s.replace(/(^|[\s-])([^\s-])/g,function(m,a,b){return a+b.toUpperCase();});}
function teamColor(i){return 'var(--t'+((i%8)+1)+')';}
function fresh(){return {screen:'setup',teams:[],used:{},turn:0,q:null,snd:true};}
function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(r){
      var s=JSON.parse(r);
      if(s&&s.screen&&Array.isArray(s.teams)){
        s=Object.assign(fresh(),s);
        if(s.screen!=='setup'&&!s.teams.length) return fresh();
        if(s.screen==='question'&&!s.q) s.screen='board';
        return s;
      }
    }
  }catch(e){}
  return fresh();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

var S=load();
var setupN=Math.min(8,Math.max(1,S.teams.length||2));
var setupNames=S.teams.map(function(t){return t.name;});
var tickId=null;

/* sound */
var ac=null;
function beep(f,d,delay){
  if(!S.snd) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
    var o=ac.createOscillator(),g=ac.createGain();
    o.type='sine'; o.frequency.value=f; g.gain.value=0.09;
    o.connect(g); g.connect(ac.destination);
    var t=ac.currentTime+(delay||0);
    o.start(t); o.stop(t+d);
  }catch(e){}
}
document.addEventListener('click',function(){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume();}catch(e){}
},{once:true});

/* setup screen */
function renderSetup(){
  $('setupLede').textContent=CATS.length+' categories, '+POINTS.length+' questions each, 100 to 1,000 points. Teams take turns choosing a category and a point level.';
  $('teamCount').textContent=setupN;
  $('minusBtn').disabled=setupN<=1;
  $('plusBtn').disabled=setupN>=8;
  var box=$('names'); box.textContent='';
  for(var i=0;i<setupN;i++){
    (function(i){
      var lab=document.createElement('label'); lab.className='field'; lab.style.setProperty('--tc',teamColor(i));
      var sp=document.createElement('span'); var dot=document.createElement('i'); sp.append(dot,document.createTextNode('Team '+(i+1)));
      var inp=document.createElement('input'); inp.type='text'; inp.id='team-name-'+(i+1); inp.maxLength=24; inp.autocomplete='off'; inp.placeholder='Team '+(i+1); inp.value=setupNames[i]||''; inp.setAttribute('autocapitalize','words');
      inp.addEventListener('input',function(e){
        if(!e.isComposing){
          var pos=inp.selectionStart, f=nameCase(inp.value);
          if(f!==inp.value){inp.value=f; try{inp.setSelectionRange(pos,pos);}catch(_){}}
        }
        setupNames[i]=inp.value;
      });
      lab.append(sp,inp); box.append(lab);
    })(i);
  }
}
$('minusBtn').onclick=function(){if(setupN>1){setupN--;renderSetup();}};
$('plusBtn').onclick=function(){if(setupN<8){setupN++;renderSetup();}};
$('setupForm').addEventListener('submit',function(e){
  e.preventDefault();
  var teams=[];
  for(var i=0;i<setupN;i++) teams.push({name:nameCase((setupNames[i]||'').trim().replace(/\s+/g,' '))||('Team '+(i+1)),score:0,correct:0});
  S.teams=teams; S.last=null; S.used={}; S.turn=0; S.q=null; S.screen='board';
  render();
});

/* board */
function renderBoard(){
  var t=S.teams[S.turn];
  $('boardTeam').textContent=t.name;
  $('boardDot').style.background=teamColor(S.turn);
  var wrap=$('board'); wrap.textContent=''; wrap.style.setProperty('--rows',Math.ceil(CATS.length/3)); wrap.style.setProperty('--rowsm',Math.ceil(CATS.length/2));
  CATS.forEach(function(cat,ci){
    var sec=document.createElement('section'); sec.className='cat';
    var left=POINTS.filter(function(p,ri){return S.used[ci+'-'+ri]===undefined;}).length;
    var head=document.createElement('div'); head.className='cat-head';
    var h=document.createElement('h3'); h.textContent=cat.n;
    var sm=document.createElement('small'); sm.textContent=left+' left';
    head.append(h,sm); sec.append(head);
    var tiles=document.createElement('div'); tiles.className='tiles';
    POINTS.forEach(function(p,ri){
      var b=document.createElement('button'); b.type='button'; b.className='tile'; b.textContent=p;
      var u=S.used[ci+'-'+ri];
      if(u!==undefined){
        b.disabled=true; b.classList.add('used');
        if(u>=0){b.classList.add('won'); b.style.setProperty('--tc',teamColor(u));}
      }else{
        b.setAttribute('aria-label',cat.n+', '+p+' points');
        b.onclick=function(){openQuestion(ci,ri);};
      }
      tiles.append(b);
    });
    sec.append(tiles); wrap.append(sec);
  });
  $('played').textContent=Object.keys(S.used).length+' of '+TOTAL+' played';
}

/* timer */
function stopTick(){if(tickId){clearInterval(tickId);tickId=null;}}
function runTick(){stopTick();tickId=setInterval(onTick,200);onTick();}
function onTick(){
  var q=S.q;
  if(!q||!q.deadline){stopTick();return;}
  if(q.deadline-Date.now()<=0){timeUp();return;}
  updateTimer();
}
function pause(){
  var q=S.q;
  if(q&&q.deadline){q.remaining=Math.max(0,q.deadline-Date.now());q.deadline=null;}
  stopTick();
}
function updateTimer(){
  var q=S.q; if(!q) return;
  var rem=q.deadline?Math.max(0,q.deadline-Date.now()):q.remaining;
  var s=Math.ceil(rem/1000);
  $('timeText').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  $('timeBar').style.width=(rem/q.total*100)+'%';
  var low=rem<=10000&&!q.ended;
  $('timer').classList.toggle('low',low);
  $('barWrap').classList.toggle('barlow',low||q.ended);
  $('timeState').textContent=q.ended?'Closed':(!q.deadline?'Paused':'');
}
function nextFreeTeam(q){
  var n=S.teams.length;
  for(var k=1;k<=n;k++){
    var i=(q.team+k)%n;
    if(q.attempted.indexOf(i)<0) return i;
  }
  return -1;
}
function timeUp(){
  var q=S.q; if(!q) return;
  stopTick();
  beep(520,.18,0); beep(520,.18,.28); beep(390,.35,.56);
  handOver('time');
}
/* Give the same question to the next team that has not tried it yet (30 seconds). If every team has tried, close it. */
function handOver(why){
  var q=S.q; if(!q) return;
  var prev=S.teams[q.team].name;
  var next=nextFreeTeam(q);
  if(next>=0){
    var ms=passMsFor(q.r);
    q.team=next; q.attempted.push(next);
    q.note=(why==='time'?"Time's up for "+prev+'. ':prev+' passed. ')+S.teams[next].name+' has '+(ms/1000)+' seconds, answer quickly!';
    q.revealed=false; q.total=ms; q.remaining=ms; q.deadline=Date.now()+ms;
    render(); runTick();
  }else{
    q.ended=true; q.revealed=true; q.deadline=null; q.remaining=0;
    q.note=why==='time'?"Time's up. No team answered in time.":'No team could answer this one.';
    S.used[q.c+'-'+q.r]=-1;
    render();
  }
}

/* question */
function openQuestion(ci,ri){
  var ms=limitFor(ri);
  S.q={c:ci,r:ri,starter:S.turn,team:S.turn,attempted:[S.turn],revealed:false,ended:false,note:'',total:ms,remaining:ms,deadline:Date.now()+ms};
  S.screen='question';
  render(); runTick();
}
function renderQuestion(){
  var q=S.q; var cat=CATS[q.c]; var qa=cat.q[q.r];
  $('qCat').textContent=cat.n;
  $('qPts').textContent=POINTS[q.r];
  $('qTeam').textContent=S.teams[q.team].name;
  $('qDot').style.background=teamColor(q.team);
  $('qNote').textContent=q.note; $('qNote').hidden=!q.note;
  $('qText').textContent=qa[0]; $('qText').classList.toggle('mono',!!cat.mono);
  $('aText').textContent=qa[1]; $('answerBox').hidden=!q.revealed;
  $('revealBtn').disabled=q.revealed;
  $('rightBtn').textContent='Correct +'+POINTS[q.r];
  $('wrongBtn').textContent='Wrong −'+POINTS[q.r];
  $('liveActions').hidden=q.ended; $('endedActions').hidden=!q.ended;
  updateTimer();
}
function allUsed(){return Object.keys(S.used).length>=TOTAL;}
function leaveQuestion(nextTurn){
  stopTick();
  S.turn=nextTurn%S.teams.length; S.q=null;
  S.screen=allUsed()?'final':'board';
  render();
}
$('revealBtn').onclick=function(){
  var q=S.q; if(!q||q.revealed) return;
  pause(); q.revealed=true; render();
};
function resume(){
  var q=S.q;
  if(q&&!q.deadline&&!q.revealed&&!q.ended){q.deadline=Date.now()+q.remaining;runTick();}
}
/* After any question, the next team to pick is the one after whoever picked it, however it was passed along. */
$('rightBtn').onclick=function(){
  var q=S.q; if(!q||q.ended) return;
  var t=S.teams[q.team];
  t.score+=POINTS[q.r]; t.correct+=1;
  S.used[q.c+'-'+q.r]=q.team;
  S.last={team:q.team,key:q.c+'-'+q.r,delta:POINTS[q.r],ok:true,starter:q.starter};
  beep(880,.12,0); beep(1175,.2,.12);
  leaveQuestion(q.starter+1);
};
$('wrongBtn').onclick=function(){
  var q=S.q; if(!q||q.ended) return;
  S.teams[q.team].score-=POINTS[q.r];
  S.used[q.c+'-'+q.r]=-1;
  S.last={team:q.team,key:q.c+'-'+q.r,delta:-POINTS[q.r],ok:false,starter:q.starter};
  beep(260,.35,0);
  leaveQuestion(q.starter+1);
};
$('passBtn').onclick=function(){var q=S.q; if(!q||q.ended) return; stopTick(); handOver('pass');};
$('backBtn').onclick=function(){var q=S.q; if(!q) return; leaveQuestion(q.starter+1);};

/* scoreboard */
function renderScores(){
  var show=(S.screen==='board'||S.screen==='question');
  var box=$('scores'); box.hidden=!show; box.textContent='';
  if(!show) return;
  var active=S.screen==='board'?S.turn:(S.q?S.q.team:-1);
  S.teams.forEach(function(t,i){
    var el=document.createElement('div'); el.className='chip'+(i===active?' on':'');
    el.style.setProperty('--tc',teamColor(i));
    if(i===active) el.setAttribute('aria-current','true');
    var d=document.createElement('span'); d.className='dot';
    var n=document.createElement('span'); n.textContent=t.name;
    var s=document.createElement('b'); s.textContent=t.score;
    el.append(d,n,s); box.append(el);
  });
}

/* final */
function renderFinal(){
  var order=S.teams.map(function(t,i){return {t:t,i:i};}).sort(function(a,b){return b.t.score-a.t.score||a.i-b.i;});
  var max=order[0].t.score;
  var winners=order.filter(function(o){return o.t.score===max;}).map(function(o){return o.t.name;});
  var line;
  if(max<=0) line=max===0?'No points on the board':'Nobody finished in the plus';
  else if(winners.length===1) line=winners[0]+' wins';
  else line=winners.slice(0,-1).join(', ')+' and '+winners[winners.length-1]+' tie for first';
  $('winnerLine').textContent=line;
  var ol=$('rankList'); ol.textContent='';
  var rank=0,prev=null;
  order.forEach(function(o,idx){
    if(o.t.score!==prev){rank=idx+1;prev=o.t.score;}
    var li=document.createElement('li'); if(rank===1&&max>0) li.className='first';
    li.style.setProperty('--tc',teamColor(o.i));
    var n=document.createElement('span'); n.className='n'; n.textContent=rank;
    var nm=document.createElement('span'); nm.className='nm'; var dot=document.createElement('i'); dot.style.background=teamColor(o.i);
    nm.append(dot,document.createTextNode(o.t.name));
    var sc=document.createElement('span'); sc.className='sc'; sc.textContent=o.t.score;
    var meta=document.createElement('div'); meta.className='meta';
    var bar=document.createElement('div'); bar.className='bar'; var bi=document.createElement('i'); bi.style.width=(max>0?Math.max(0,o.t.score)/max*100:0)+'%'; bar.append(bi);
    var c=document.createElement('span'); c.textContent=o.t.correct+(o.t.correct===1?' question correct':' questions correct');
    meta.append(bar,c);
    li.append(n,nm,sc,meta); ol.append(li);
  });
}
$('againBtn').onclick=function(){
  S.teams.forEach(function(t){t.score=0;t.correct=0;});
  S.used={}; S.last=null; S.turn=0; S.q=null; S.screen='board'; render();
};
$('newBtn').onclick=function(){
  setupNames=S.teams.map(function(t){return t.name;});
  setupN=Math.min(8,Math.max(1,S.teams.length||2));
  S.teams=[]; S.last=null; S.used={}; S.turn=0; S.q=null; S.screen='setup';
  renderSetup(); render();
};

/* undo the last Correct or Wrong: points come back and the tile opens again for the team that picked it */
function undoLast(){
  var l=S.last; if(!l) return;
  var t=S.teams[l.team];
  if(t){t.score-=l.delta; if(l.ok) t.correct=Math.max(0,t.correct-1);}
  delete S.used[l.key];
  S.turn=l.starter%S.teams.length; S.last=null;
  if(S.screen==='final') S.screen='board';
  render();
}
$('undoBtn').onclick=undoLast;

/* edit scores by hand */
function renderEdit(){
  var list=$('editList'); list.textContent='';
  S.teams.forEach(function(t,i){
    var row=document.createElement('div'); row.className='erow';
    var nm=document.createElement('div'); nm.className='en';
    var dot=document.createElement('i'); dot.style.background=teamColor(i);
    var tx=document.createElement('span'); tx.textContent=t.name; nm.append(dot,tx);
    var c=document.createElement('div'); c.className='ec';
    var minus=document.createElement('button'); minus.type='button'; minus.textContent='−'; minus.setAttribute('aria-label','Subtract 100 from '+t.name);
    var inp=document.createElement('input'); inp.type='number'; inp.step='100'; inp.inputMode='numeric'; inp.id='score-edit-'+(i+1); inp.value=t.score; inp.setAttribute('aria-label',t.name+' score');
    var plus=document.createElement('button'); plus.type='button'; plus.textContent='+'; plus.setAttribute('aria-label','Add 100 to '+t.name);
    function setScore(v){
      v=Math.round(Number(v)); if(!isFinite(v)) v=0;
      t.score=v; renderScores(); save();
    }
    inp.addEventListener('input',function(){ if(inp.value!==''&&inp.value!=='-') setScore(inp.value); });
    inp.addEventListener('blur',function(){ inp.value=t.score; });
    minus.onclick=function(){setScore(t.score-100); inp.value=t.score;};
    plus.onclick=function(){setScore(t.score+100); inp.value=t.score;};
    c.append(minus,inp,plus); row.append(nm,c); list.append(row);
  });
}
$('editBtn').onclick=function(){renderEdit(); $('editBox').hidden=false;};
function closeEdit(){$('editBox').hidden=true; render();}
$('editDone').onclick=closeEdit;
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('editBox').hidden) closeEdit();});

/* header buttons */
function renderSound(){
  var b=$('soundBtn'); b.setAttribute('aria-pressed',String(!!S.snd)); b.textContent=S.snd?'Sound on':'Sound off';
}
$('soundBtn').onclick=function(){S.snd=!S.snd;renderSound();if(S.snd)beep(660,.1,0);save();};
var finishArm=false,finishT=null;
function resetFinish(){finishArm=false;clearTimeout(finishT);$('finishBtn').textContent='Finish game';}
$('finishBtn').onclick=function(){
  if(!finishArm){
    finishArm=true; $('finishBtn').textContent='Tap again to finish';
    finishT=setTimeout(resetFinish,4000);
  }else{
    resetFinish(); stopTick(); S.screen='final'; render();
  }
};

/* render */
function render(){
  ['setup','board','question','final'].forEach(function(id){$('screen-'+id).hidden=S.screen!==id;});
  $('finishBtn').hidden=S.screen!=='board';
  $('undoBtn').hidden=!(S.last&&(S.screen==='board'||S.screen==='final'));
  $('editBtn').hidden=S.screen==='setup';
  if(S.screen!=='board') resetFinish();
  if(S.screen==='board') renderBoard();
  else if(S.screen==='question') renderQuestion();
  else if(S.screen==='final') renderFinal();
  renderScores();
  save();
}

renderSetup(); renderSound(); render();
if(S.screen==='question'&&S.q){ if(S.q.deadline) runTick(); else resume(); }
})();
</script>
